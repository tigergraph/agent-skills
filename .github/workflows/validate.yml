name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate ./
      - name: Validate local plugins
        run: |
          for p in plugins/*/; do
            claude plugin validate "$p" --strict
          done
      - name: No symlinks in plugins
        run: |
          if find plugins -type l | grep .; then
            echo "Symlinks are not allowed in plugin directories" >&2
            exit 1
          fi
